<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <h2>Student Attendance</h2>

    <div>
        <a href="/">Home</a>
        <a href="/add_student">Add Student</a>
        <a href="/attendance">Attendance</a>
        <a href="/view_attendance">View Attendance</a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Mark Attendance</h1>
        <p>Select the attendance status for students.</p>
    </div>

    <div class="table-box">

        <form method="POST">

            <table>

                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>

                        <td>{{ student[0] }}</td>

                        <td>{{ student[1] }}</td>

                        <td>
                            <select name="status_{{ student[0] }}">
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            <br>

            <button type="submit" class="btn">
                Save Attendance
            </button>

        </form>

    </div>

</div>

</body>
</html>
