<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <h2>Student Attendance</h2>

    <div>
        <a href="/">Home</a>
        <a href="/add_student">Add Student</a>
        <a href="/attendance">Attendance</a>
        <a href="/view_attendance">View Attendance</a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Student Attendance Dashboard</h1>
        <p>Manage student records and attendance easily.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p>--</p>
        </div>

        <div class="card">
            <h3>Today's Attendance</h3>
            <p>--</p>
        </div>

        <div class="card">
            <h3>Attendance Rate</h3>
            <p>--%</p>
        </div>

    </div>

    <div class="form-box">

        <h2>Quick Actions</h2>

        <br>

        <a href="/add_student">
            <button class="btn">Add Student</button>
        </a>

        <a href="/attendance">
            <button class="btn">Mark Attendance</button>
        </a>

        <a href="/view_attendance">
            <button class="btn">View Attendance</button>
        </a>

    </div>

</div>

<div class="footer">
    <p>Student Attendance Management System</p>
</div>

</body>
</html>
